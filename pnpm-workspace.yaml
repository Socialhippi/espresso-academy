allowBuilds:
  # esbuild is what `sanity exec` and `sanity build` compile TypeScript with; without its install
  # script the CLI refuses to run at all.
  esbuild: true
  sharp: false
  unrs-resolver: false

overrides:
  # The only high-severity findings in the tree are js-yaml 3.13.1, reached solely through
  # sanity > @sanity/cli > @vercel/frameworks. Both advisories are quadratic-CPU parses of hostile
  # YAML, and the CLI only ever parses local project files, so the real exposure is small. The fix
  # is a patch bump inside the same major, so there is no reason to carry it as an accepted risk.
  # pnpm 11 reads overrides here rather than from package.json.
  js-yaml@<3.15.1: '>=3.15.1'

  # smol-toml <=1.7.0, denial of service via a malformed TOML document (GHSA-7w5x-hrqm-74c2).
  # Same shape and same path as the js-yaml entry above: reached only through
  # sanity > @sanity/cli > @vercel/frameworks, which parses local project files and never anything
  # a visitor supplies. @sanity/cli already resolves 1.8.0 for itself; it was @vercel/frameworks
  # holding a second copy at 1.5.2. Nothing here ships to the browser or to a server route, so the
  # real exposure is a developer's own machine — but it is a patch bump inside the same major and
  # it is the only thing standing between this repository and a green CI run.
  smol-toml@<1.7.1: '>=1.7.1'
