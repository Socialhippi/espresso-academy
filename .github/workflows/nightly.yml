name: Nightly

on:
  schedule:
    # 03:00 IST, which is a quiet hour for this audience and after any evening deploy.
    - cron: "30 21 * * *"
  workflow_dispatch:

jobs:
  full-suite:
    name: Full suite
    runs-on: ubuntu-latest
    # The 40-minute cap lives here now, and only here. Measured: about 2069 tests at ~1.17/sec on a
    # two-core runner is ~29 minutes, plus install, browsers and the build. 25 once cut a run off at
    # test 1569 with nothing failing.
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      # The suite writes: bookings, seats, enquiries. It runs against `ci` and tests/global-setup.ts
      # refuses anything else. Never the secret, which the stale-content job needs pointing at
      # production.
      NEXT_PUBLIC_SANITY_DATASET: ci
      NEXT_PUBLIC_SANITY_API_VERSION: "2026-09-05"
      SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
      SANITY_API_WRITE_TOKEN: ${{ secrets.SANITY_API_WRITE_TOKEN }}
      RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
      RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${{ secrets.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
      RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      NEXT_PUBLIC_INDEXABLE: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium webkit
      - run: pnpm build
      - run: pnpm test:e2e
      - name: The standing design and security scripts
        run: |
          pnpm start &
          npx wait-on http://localhost:3000 --timeout 60000
          node scripts/check-overflow.mjs
          node scripts/check-brand-contrast.mjs
          node scripts/check-target-size.mjs
          node scripts/check-csp.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse:
    name: Lighthouse on production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Measure the live site
        run: node scripts/lighthouse.mjs "${{ vars.SITE_URL || 'https://espresso-academy-india.vercel.app' }}"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-reports
          path: docs/audits/lh2-*.report.json
          retention-days: 30

  links:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Crawl the sitemap and report anything that is not 200
        run: node scripts/check-links.mjs "${{ vars.SITE_URL || 'https://espresso-academy-india.vercel.app' }}"

  stale-content:
    name: Stale content report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: What the academy still has to fill in
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
        run: node scripts/stale-content.mjs

  lead-failures:
    name: Lead delivery report
    runs-on: ubuntu-latest
    # Reports, never writes. The count goes to this job's summary every night and to the alert
    # inbox only when it is above zero: a nightly "0 leads were lost" email is one people filter,
    # and then the one that says 4 gets filtered with it. No contents: write, and nothing commits
    # to main.
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Count the leads that were stored and never delivered
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
          # Absent from this repository on purpose, so the alert half degrades and says so. Add
          # both as secrets to have the academy emailed when the count is not zero.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          LEAD_TO_EMAIL: ${{ secrets.LEAD_TO_EMAIL }}
        run: node scripts/lead-failures.mjs
